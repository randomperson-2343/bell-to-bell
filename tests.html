<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bell to Bell Tests</title>
  <style>
    body { background: #1b1a21; color: #e4dfd2; font-family: Consolas, Menlo, monospace; padding: 24px; }
    .pass { color: #4fae7a; } .fail { color: #c2495a; }
    li { margin: 4px 0; } small { color: #9a99a6; display: block; margin-left: 20px; }
  </style>
</head>
<body>
  <h1>Bell to Bell: test suite</h1>
  <p id="sum">Running…</p>
  <ul id="out"></ul>
  <pre id="reach"></pre>
  <script src="js/core/util.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/art/palette.js"></script>
  <script src="js/art/pixel.js"></script>
  <script src="js/art/scenes.js"></script>
  <script src="js/art/rhythm.js"></script>
  <script src="js/market/tickers.js"></script>
  <script src="js/market/engine.js"></script>
  <script src="js/market/news.js"></script>
  <script src="js/market/sqwak.js"></script>
  <script src="js/trading/options.js"></script>
  <script src="js/trading/broker.js"></script>
  <script src="js/stress.js"></script>
  <script src="js/audio/sfx.js"></script>
  <script src="js/audio/music.js"></script>
  <script src="js/interrupts.js"></script>
  <script src="js/game.js"></script>
  <script>
    window.BTB.Settings = {
      get: () => ({ storyDayLength: 180, effects: 'off', cinematics: 'off' }),
      set: () => {}, fx: () => 0, motion: () => false, apply: () => {}
    };
    window.BTB.Cinematic = { running: false, play: (n, o, cb) => cb && cb() };
    window.BTB.Screens = { briefing: (g, b, cb) => cb && cb(), eod: (g, r, cb) => cb && cb(), choice: () => {}, aftermath: (t, x, cb) => cb && cb(), ending: () => {}, closeModal: () => {} };
  </script>
  <script src="js/modes/story/story-data.js"></script>
  <script src="js/modes/story/patch3-data.js"></script>
  <script src="js/modes/story/sqwak-story.js"></script>
  <script src="js/modes/story/endings.js"></script>
  <script src="js/modes/story/patch3-endings.js"></script>
  <script src="js/modes/story/economy.js"></script>
  <script src="js/modes/story/story-engine.js"></script>
  <script src="js/tests/tests.js"></script>
  <script>
    const res = BTB.Tests.results;
    const fails = res.filter((r) => !r.ok).length;
    document.getElementById('sum').innerHTML = `<b class="${fails ? 'fail' : 'pass'}">${res.length - fails}/${res.length} passed</b>`;
    document.getElementById('out').innerHTML = res.map((r) => `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'} ${r.name}${r.ok ? '' : `<small>${r.err}</small>`}</li>`).join('');
    if (BTB.__storyReach) document.getElementById('reach').textContent = 'Story paths: ' + BTB.__storyReach.paths + '\nEndings: ' + JSON.stringify(BTB.__storyReach.reached, null, 2);
  </script>
</body>
</html>
