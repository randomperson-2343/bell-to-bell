name: Phone layout check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/art/build-sprites.js --check
      - run: node tools/art/build-ui.js --check
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node js/tests/phone-run.js
      - name: UI overlap audit (report only)
        if: always()
        continue-on-error: true
        env:
          UI_AUDIT_LOG: '1'
        run: node js/tests/ui-audit.js
      - name: Logic tests
        if: always()
        run: node js/tests/node-run.js
      - name: Browser flow check (report only)
        if: always()
        continue-on-error: true
        run: node js/tests/browser-run.js
      - name: Motion check (report only; reprints the pinned pictures that changed)
        if: always()
        continue-on-error: true
        run: node js/tests/motion-run.js --update-golden
      - name: Audio render check (report only)
        if: always()
        continue-on-error: true
        run: node js/tests/audio-render-run.js --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: qa/phone/
          retention-days: 14
